name: Deploy to TestFlight

on:
  push:
    branches:
      - mobile-production

jobs:
  build-and-deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          # Project pubspec already disables SPM; pin runner config too (Flutter 3.44+ default on).
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Configure Mapbox downloads
        env:
          SDK_REGISTRY_TOKEN: ${{ secrets.SDK_REGISTRY_TOKEN }}
        run: |
          if [ -z "${SDK_REGISTRY_TOKEN:-}" ]; then
            echo "SDK_REGISTRY_TOKEN secret is required for Mapbox iOS/Android SDK downloads"
            exit 1
          fi
          printf 'machine api.mapbox.com\nlogin mapbox\npassword %s\n' "$SDK_REGISTRY_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          echo "SDK_REGISTRY_TOKEN=$SDK_REGISTRY_TOKEN" >> android/gradle.properties

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ] || [ -z "${BUILD_PROVISION_PROFILE_BASE64:-}" ]; then
            echo "Missing BUILD_CERTIFICATE_BASE64 or BUILD_PROVISION_PROFILE_BASE64 secrets"
            exit 1
          fi

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(date +%s | shasum | base64 | head -c 32)

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH login.keychain-db

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_PLIST=$RUNNER_TEMP/pp.plist
          security cms -D -i "$PP_PATH" > "$PP_PLIST"
          PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PP_PLIST")
          PP_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PP_PLIST")
          echo "Installed provisioning profile: $PP_NAME ($PP_UUID)"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PP_UUID.mobileprovision"

          # Profile must include Push Notifications — otherwise TestFlight FCM never gets APNs token.
          if ! grep -q 'aps-environment' "$PP_PLIST"; then
            echo "ERROR: provisioning profile has no aps-environment (Push). Regenerate App Store profile with Push Notifications."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$PP_PLIST" || true

          echo "PP_NAME=$PP_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Build IPA
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${MAPBOX_ACCESS_TOKEN:-}" ]; then
            echo "MAPBOX_ACCESS_TOKEN secret is required (public token clover_flutter)"
            exit 1
          fi

          # Unlock keychain for codesign (entitlements must be embedded — never --no-codesign).
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Flutter 3.47+ treats trailing KEY=VALUE (and args after --) as Dart targets,
          # so CODE_SIGN_* cannot be passed on the flutter CLI. Patch Runner Release in
          # pbxproj for this CI job only (checkout is ephemeral). Local stays Automatic.
          python3 <<'PY'
          from pathlib import Path
          import os, re, sys

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()
          pp = os.environ["PP_NAME"]
          pattern = re.compile(
              r"(CODE_SIGN_ENTITLEMENTS = Runner/RunnerRelease\.entitlements;\n"
              r"\t\t\t\tCODE_SIGN_IDENTITY = )\"[^\"]*\";(\n"
              r"\t\t\t\tCODE_SIGN_STYLE = )[^;]+;(\n"
              r"\t\t\t\tCURRENT_PROJECT_VERSION = \"\$\(FLUTTER_BUILD_NUMBER\)\";\n"
              r"\t\t\t\tDEAD_CODE_STRIPPING = NO;\n"
              r"\t\t\t\tDEVELOPMENT_TEAM = TD97J996Q4;\n"
              r".*?"
              r"PROVISIONING_PROFILE_SPECIFIER = )\"[^\"]*\";",
              re.DOTALL,
          )

          def repl(m: re.Match[str]) -> str:
              return (
                  m.group(1)
                  + '"Apple Distribution";'
                  + m.group(2)
                  + "Manual;"
                  + m.group(3)
                  + f'"{pp}";'
              )

          new, n = pattern.subn(repl, text, count=1)
          if n != 1:
              sys.exit(f"Failed to patch Runner Release signing (matches={n})")
          path.write_text(new)
          print(f"CI signing: Runner Release → Manual / Apple Distribution / {pp}")
          PY

          flutter build ipa --release \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --export-options-plist=ios/Runner/ExportOptions.plist

          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n 1)
          if [ -z "${IPA_PATH:-}" ] || [ ! -f "$IPA_PATH" ]; then
            echo "Missing IPA after flutter build ipa"
            find build/ios -maxdepth 4 -type f -name '*.ipa' 2>/dev/null || true
            exit 1
          fi

          # Gate: IPA must carry production push entitlement (FCM needs APNs).
          TMP=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$TMP"
          APP=$(find "$TMP/Payload" -maxdepth 1 -name '*.app' | head -n 1)
          ENT_FILE="$TMP/entitlements.plist"
          codesign -d --entitlements "$ENT_FILE" "$APP"
          echo "--- IPA entitlements ---"
          plutil -p "$ENT_FILE" || cat "$ENT_FILE"
          APS=$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$ENT_FILE" 2>/dev/null || true)
          if [ "$APS" != "production" ]; then
            echo "ERROR: IPA aps-environment='$APS' (want production). FCM will not get a token on TestFlight."
            exit 1
          fi
          echo "OK: aps-environment=production"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n 1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
