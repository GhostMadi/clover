[api]
enabled = true

[db]
shadow_port = 54320

# Шлюз по умолчанию проверяет JWT до Deno; при рассинхроне ключей подписи даёт 401 без тела.
# Проверка пользователя выполняется в коде: [requireSupabaseUser].
[functions.create_post]
verify_jwt = false

[functions.upload_post_media_poster]
verify_jwt = false

[functions.register_post_view]
verify_jwt = false

[functions.register_post_send]
verify_jwt = false

[functions.send_chat_attachments]
verify_jwt = false

# Auth Send SMS Hook — signature via Standard Webhooks, not user JWT.
[functions.send_sms_hook]
verify_jwt = false

# Meta WhatsApp Cloud API inbound webhook (NOT Auth Send SMS Hook).
[functions.whatsapp_webhook]
verify_jwt = false

# Push outbox drain (FCM). Auth inside: service_role bearer or PUSH_WORKER_SECRET.
[functions.drain_push_outbox]
verify_jwt = false

# Local Auth Hook (optional). Hosted: Authentication → Hooks → Send SMS in Dashboard.
# To enable locally, set SEND_SMS_HOOK_SECRET=v1,whsec_<base64> in supabase/.env and:
# [auth.hook.send_sms]
# enabled = true
# uri = "http://host.docker.internal:54321/functions/v1/send_sms_hook"
# secrets = "env(SEND_SMS_HOOK_SECRET)"

